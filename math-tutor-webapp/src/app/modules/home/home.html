<div class="min-h-screen bg-slate-950 text-slate-100 pb-20">
  <div class="mx-auto max-w-4xl px-4 py-8">
    <div class="mb-8 grid grid-cols-3 gap-3">
      <div
        *ngFor="let opt of modelOptions"
        (click)="selectedModel = opt.value"
        [ngClass]="
          selectedModel === opt.value
            ? 'border-sky-500 bg-sky-500/10'
            : 'border-white/10 bg-white/5'
        "
        class="cursor-pointer rounded-xl border p-4 transition-all"
      >
        <h3 class="font-bold text-white text-sm">{{ opt.label }}</h3>
        <p class="text-xs text-slate-400">{{ opt.desc }}</p>
      </div>
    </div>

    <div class="rounded-3xl border border-white/10 bg-white/5 p-6 backdrop-blur-xl">
      <div class="mb-4 flex items-center justify-between">
        <h2 class="font-semibold text-white">กรอกโจทย์ปัญหา</h2>
        <p-button
          label="ล้าง"
          severity="secondary"
          [text]="true"
          (onClick)="clearMath()"
        ></p-button>
      </div>

      <div class="rounded-2xl border border-slate-200 bg-white px-4 py-6 shadow-inner">
        <math-field
          mathFieldAccessor
          [(ngModel)]="latexValue"
          #mf
          class="text-black w-full outline-none"
          style="font-size: 1.5rem"
        ></math-field>
      </div>

      <div class="mt-6 border-t border-white/10 pt-6">
        <span class="text-xs font-bold text-sky-400 uppercase tracking-widest">Preview</span>
        <div
          class="mt-3 flex justify-center rounded-xl bg-slate-900/50 p-6 min-h-[80px] items-center"
        >
          <math-field
            read-only
            [value]="latexValue"
            style="
              --foreground-color: #ffffff;
              font-size: 1.8rem;
              border: none;
              background: transparent;
            "
          >
          </math-field>
        </div>
      </div>

      <div class="mt-6 flex flex-wrap gap-2">
        <button
          *ngFor="let ex of examples"
          (click)="loadExample(ex.latex)"
          class="rounded-lg bg-white/5 px-3 py-1.5 text-xs text-sky-300 ring-1 ring-white/10 hover:bg-sky-400/20"
        >
          {{ ex.label }}
        </button>
      </div>

      <p-button
        label="ส่งคำถาม"
        icon="pi pi-send"
        [style]="{ width: '100%', 'margin-top': '20px' }"
        [loading]="isProcessing"
        (onClick)="subMitQuestion()"
      ></p-button>
    </div>

    <div class="space-y-3">
      <div class="rounded-2xl bg-white/5 p-4 border border-white/5 text-sm">
        {{ chatMessages }}
      </div>
      <div *ngIf="isTyping" class="text-slate-500 text-xs animate-pulse">AI กำลังประมวลผล...</div>
    </div>

    <div *ngIf="showResults" class="mt-8 space-y-6">
      <div class="rounded-2xl border border-amber-500/30 bg-amber-500/5 p-5">
        <h3 class="text-amber-400 font-bold text-sm mใb-4">WOLFRAM RESULT</h3>
        <div class="text-2xl text-white text-center mb-4">x = \pm 2i</div>
        <div class="text-sm text-slate-400">
          <div *ngFor="let step of wolframResult.steps" class="mb-1">• {{ step }}</div>
        </div>
      </div>

      <div class="space-y-3">
        <math-field
          read-only
          [value]="chatMessages"
          style="
            --foreground-color: #ffffff;
            font-size: 1.8rem;
            border: none;
            background: transparent;
          "
        >
        </math-field>

        dwqdqwwqdwqqdwwdq

        <div class="rounded-2xl bg-white/5 p-4 border border-white/5 text-sm">
          {{ chatMessages }}
        </div>
        <div *ngIf="isTyping" class="text-slate-500 text-xs animate-pulse">AI กำลังประมวลผล...</div>
      </div>
    </div>
  </div>
</div>
