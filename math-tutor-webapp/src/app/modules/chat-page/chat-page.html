<div
  class="min-h-screen bg-[#0E0E0E] text-neutral-200 font-sans antialiased selection:bg-red-500/30"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-16 space-y-12">
    <div class="text-center space-y-5 max-w-3xl mx-auto">
      <div class="relative w-full max-w-sm mx-auto mb-8">
        <div
          class="absolute inset-0 bg-gradient-to-r from-red-600 via-rose-500 to-orange-500 blur-lg opacity-40"
        ></div>
        <div
          class="relative h-1 bg-gradient-to-r from-red-600 via-rose-500 to-orange-500 rounded-full"
        ></div>
      </div>
      <div class="flex flex-col items-center gap-2 justify-center">
        <h1 class="text-2xl sm:text-3xl font-medium tracking-wider text-neutral-400">
          P'Gen Nong'Tam
        </h1>
        <h1 class="text-4xl sm:text-5xl font-bold tracking-tight text-white drop-shadow-md">
          Math Tutor AI
        </h1>
      </div>
      <p class="text-lg text-neutral-400">
        Discover step-by-step calculus solutions powered by top AI models.
        <br class="hidden sm:block" />
        Empowering students with quality-driven insights.
      </p>
    </div>

    <div class="max-w-2xl mx-auto relative group">
      <div
        class="absolute -inset-0.5 bg-gradient-to-r from-neutral-800 to-neutral-700 rounded-xl blur opacity-30 group-hover:opacity-50 transition duration-500"
      ></div>
      <div
        class="relative flex flex-col sm:flex-row gap-3 bg-[#161616] p-2 rounded-xl border border-neutral-800"
      >
        <div
          class="flex-1 rounded-lg bg-[#0E0E0E] border border-neutral-800 focus-within:border-neutral-600 transition-colors flex items-center px-2"
        >
          <math-field
            class="w-full text-lg p-2 bg-transparent outline-none border-none min-h-[45px] text-white"
            [value]="question()"
            (input)="question.set($any($event.target).value)"
          >
          </math-field>
        </div>

        <button
          (click)="askQuestion()"
          [disabled]="isStreaming() || !question()"
          class="sm:px-8 py-3 bg-[#DE122F] hover:bg-[#B80F25] text-white font-medium rounded-lg shadow-sm active:scale-95 disabled:opacity-50 disabled:pointer-events-none transition-all duration-200 flex items-center justify-center gap-2 min-w-[130px]"
        >
          <span
            *ngIf="isStreaming()"
            class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"
          ></span>
          <span>{{ isStreaming() ? 'Processing' : 'Explore >' }}</span>
        </button>
      </div>
    </div>

    <div *ngIf="hasResult()" class="pt-8">
      <div class="mb-8 text-center">
        <span
          class="inline-flex items-center gap-2 px-4 py-2 rounded-full bg-[#161616] border border-neutral-800 text-sm text-neutral-400 font-mono"
        >
          <span class="w-2 h-2 rounded-full bg-red-500 animate-pulse"></span>
          Wolfram: {{ wolframRaw() || 'Calculating...' }}
        </span>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        <div
          class="bg-[#111111] border border-neutral-800 border-t-2 border-t-[#DE122F] flex flex-col h-full min-h-[400px]"
        >
          <div class="p-5 border-b border-neutral-800/50 flex justify-between items-center">
            <h3 class="font-semibold text-white text-sm">ติวเตอร์คนที่ 1</h3>
            <button
              class="text-xs text-neutral-400 hover:text-white transition-colors flex items-center gap-1"
            >
              Vote <span>></span>
            </button>
          </div>
          <div class="p-5 flex-1 overflow-y-auto">
            <markdown
              class="prose prose-invert prose-sm prose-neutral max-w-none text-neutral-300"
              [data]="responses().llama"
              [katex]="true"
            ></markdown>
          </div>
        </div>

        <div
          class="bg-[#111111] border border-neutral-800 border-t-2 border-t-neutral-600 flex flex-col h-full min-h-[400px]"
        >
          <div class="p-5 border-b border-neutral-800/50 flex justify-between items-center">
            <h3 class="font-semibold text-white text-sm">ติวเตอร์คนที่ 2</h3>
            <button
              class="text-xs text-neutral-400 hover:text-white transition-colors flex items-center gap-1"
            >
              Vote <span>></span>
            </button>
          </div>
          <div class="p-5 flex-1 overflow-y-auto">
            <markdown
              class="prose prose-invert prose-sm prose-neutral max-w-none text-neutral-300"
              [data]="responses().deepseek"
              [katex]="true"
            ></markdown>
          </div>
        </div>

        <div
          class="bg-[#111111] border border-neutral-800 border-t-2 border-t-neutral-600 flex flex-col h-full min-h-[400px]"
        >
          <div class="p-5 border-b border-neutral-800/50 flex justify-between items-center">
            <h3 class="font-semibold text-white text-sm">ติวเตอร์คนที่ 3</h3>
            <button
              class="text-xs text-neutral-400 hover:text-white transition-colors flex items-center gap-1"
            >
              Vote <span>></span>
            </button>
          </div>
          <div class="p-5 flex-1 overflow-y-auto">
            <markdown
              class="prose prose-invert prose-sm prose-neutral max-w-none text-neutral-300"
              [data]="responses().qwen"
              [katex]="true"
            ></markdown>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
